# Grano Hyprland configuration
# Initial migration of the effective compositor settings.

# Load the generated palette, with hypr/colors.conf as the repository fallback.
source = ./colors.conf

monitor = DP-1,1920x1080@200.0,0x0,1,vrr,0

# Start Grano's static wallpaper backend when this configuration is active.
exec-once = hyprpaper -c ~/.config/grano/hyprpaper.conf
# Start Grano's Waybar only when this configuration is active.
exec-once = waybar -c ~/.config/grano/waybar/config.jsonc -s ~/.config/grano/waybar/style.css
# Start Grano's idle manager only when this configuration is active.
exec-once = hypridle -c ~/.config/grano/hypridle.conf
# Clipboard and removable-media helpers.
exec-once = wl-clip-persist --clipboard regular
exec-once = wl-paste --type image --watch cliphist store
exec-once = wl-paste --type text --watch cliphist store
exec-once = udiskie --no-automount --smart-tray

input {
    kb_layout = us, es
    kb_variant = es
    accel_profile = flat
    numlock_by_default = true
}

general {
    gaps_in = 3
    gaps_out = 8
    border_size = 2
    layout = dwindle
    resize_on_border = true
    col.active_border = $grano_border_active_start $grano_border_active_end 45deg
    col.inactive_border = $grano_border_inactive_start $grano_border_inactive_end 45deg
}

decoration {
    rounding = 10
    active_opacity = 0.90
    inactive_opacity = 0.75
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        ignore_opacity = true
        new_optimizations = true
        passes = 4
        size = 5
        xray = false
    }

    shadow {
        enabled = false
    }
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    vrr = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    anr_missed_pings = 5
    allow_session_lock_restore = true
}

xwayland {
    force_zero_scaling = true
}

general {
    snap {
        border_overlap = true
        enabled = true
        monitor_gap = 1
        respect_gaps = true
        window_gap = 1
    }
}

animations {
    enabled = true
}

# Grano custom animation profile.
# The original spring curves are represented as Bézier approximations because
# hyprland.conf does not expose the Lua spring curve API.
bezier = grano_open, 0.16, 1.0, 0.3, 1.0
bezier = grano_bounce, 0.2, 0.9, 0.35, 1.15
bezier = grano_smooth, 0.25, 0.1, 0.25, 1.0

animation = fadeIn, 1, 8, default
animation = fadeOut, 1, 8, default
animation = fadeSwitch, 1, 8, default
animation = fadeShadow, 1, 8, default
animation = fadeDim, 1, 8, default
animation = fadeLayers, 1, 8, default
animation = fadeLayersIn, 1, 8, default
animation = fadeLayersOut, 1, 8, default
animation = fadePopups, 1, 8, default
animation = fadePopupsIn, 1, 8, default
animation = fadePopupsOut, 1, 8, default
animation = fadeDpms, 1, 8, default
animation = windows, 1, 8, grano_open, popin 90%
animation = windowsIn, 1, 8, grano_open, popin 90%
animation = windowsOut, 1, 7, grano_bounce, popin 90%
animation = windowsMove, 1, 5, grano_smooth, slide
animation = border, 1, 1, default
animation = borderangle, 1, 30, default, once
animation = fade, 1, 8, default
animation = workspaces, 1, 6, grano_smooth, slidefade 20%
animation = workspacesIn, 1, 6, grano_smooth, slidefade 20%
animation = workspacesOut, 1, 6, grano_smooth, slidefade 20%
animation = specialWorkspace, 1, 6, grano_smooth, slidefade 20%
animation = specialWorkspaceIn, 1, 6, grano_smooth, slidefade 20%
animation = specialWorkspaceOut, 1, 6, grano_smooth, slidefade 20%
animation = zoomFactor, 1, 7, default
animation = monitorAdded, 1, 7, default

# Native window-management keybinds.
$mainMod = SUPER

bind = $mainMod, Q, killactive
bind = ALT, F4, killactive
bind = $mainMod ALT, F4, forcekillactive
bind = $mainMod, DELETE, exit
bind = $mainMod, L, exec, hyprlock -c ~/.config/grano/hyprlock.conf
bind = $mainMod, W, togglefloating
bind = ALT, P, pseudo
bind = SHIFT, F11, fullscreen, 1
bind = $mainMod, J, layoutmsg, togglesplit

bind = $mainMod, LEFT, movefocus, l
bind = $mainMod, RIGHT, movefocus, r
bind = $mainMod, UP, movefocus, u
bind = $mainMod, DOWN, movefocus, d

bind = $mainMod SHIFT, LEFT, resizeactive, -30 0
bind = $mainMod SHIFT, RIGHT, resizeactive, 30 0
bind = $mainMod SHIFT, UP, resizeactive, 0 -30
bind = $mainMod SHIFT, DOWN, resizeactive, 0 30

bind = $mainMod SHIFT CTRL, LEFT, movewindow, l
bind = $mainMod SHIFT CTRL, RIGHT, movewindow, r
bind = $mainMod SHIFT CTRL, UP, movewindow, u
bind = $mainMod SHIFT CTRL, DOWN, movewindow, d

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Native window rules.
windowrule = float 1, match:class ^(Bitwarden|org.keepassxc.KeePassXC|hyprland-share-picker|blueman-manager|pavucontrol-qt|com\\.gabm\\.satty|vlc|kvantummanager|qt6ct|qt[56]ct|nwg-(look|displays)|org\\.kde\\.ark|org\\.pulseaudio\\.pavucontrol|nm-(applet|connection-editor)|hyprpolkitagent|console-dropdown|org\\.kde\\.dolphin|.*dialog.*|[Xx]dg-desktop-portal-gtk|org\\.freedesktop\\.impl\\.portal\\.desktop\\.(hyprland|gtk))$
windowrule = float 1, match:title ^(Progress Dialog — Dolphin|Copying — Dolphin|Choose Files|Save As|Confirm to replace files|File Operation Progress|Open|Authentication Required|Add Folder to Workspace|File Upload.*|Choose wallpaper.*|Library.*|.*dialog.*|Open File|Volume Control|Save As.*|File Already Exists — Dolphin|Properties for.*)$

windowrule = float 1, match:title ^([Pp]icture[- ]?[Ii]n[- ]?[Pp]icture.*)$
windowrule = pin 1, match:title ^([Pp]icture[- ]?[Ii]n[- ]?[Pp]icture.*)$
windowrule = move 73% 72%, match:title ^([Pp]icture[- ]?[Ii]n[- ]?[Pp]icture.*)$
windowrule = size 25% 25%, match:title ^([Pp]icture[- ]?[Ii]n[- ]?[Pp]icture.*)$

windowrule = float 1, match:class ^(pinentry-.*)$
windowrule = float 1, match:title ^(Choose Files|Open File|Save As.*|File Operation Progress|Authentication Required|File Upload.*)$
windowrule = center 1, match:title ^(Choose Files|Open File|Save As.*|File Operation Progress|Authentication Required|File Upload.*)$
windowrule = pin 1, match:title ^(Choose Files|Open File|Save As.*|File Operation Progress|Authentication Required|File Upload.*)$

windowrule = no_initial_focus 1, match:class ^(xwaylandvideobridge)$
windowrule = no_focus 1, match:class ^(xwaylandvideobridge)$
windowrule = no_anim 1, match:class ^(xwaylandvideobridge)$
windowrule = no_blur 1, match:class ^(xwaylandvideobridge)$
windowrule = no_follow_mouse 1, match:class ^(xwaylandvideobridge)$
windowrule = size 1 1, match:class ^(xwaylandvideobridge)$
windowrule = opacity 0.0 override 0.0 override, match:class ^(xwaylandvideobridge)$
windowrule = workspace special:xwayland_video_bridge silent, match:class ^(xwaylandvideobridge)$

windowrule = opaque 1, match:class ^(.*dolphin.*|.*pcmanfm-qt.*|.*nemo.*|.*ark.*|.*Nautilus.*)$

# Native layer rules.
layerrule = blur 1, match:namespace ^(rofi|notifications|swaync-(notification-window|control-center)|waybar|logout_dialog)$
layerrule = ignore_alpha 0, match:namespace ^(rofi|notifications|swaync-(notification-window|control-center)|waybar|selection)$
layerrule = no_anim 1, match:namespace ^(selection)$
