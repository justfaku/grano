# Grano Hyprland configuration
# Initial migration of the effective compositor settings.

monitor = DP-1,1920x1080@200.0,0x0,1,vrr,0

input {
    kb_layout = us, es
    kb_variant = es
    accel_profile = flat
    numlock_by_default = true
}

general {
    gaps_in = 3
    gaps_out = 8
    border_size = 2
    layout = dwindle
    resize_on_border = true
    col.active_border = rgba(90ceaaff) rgba(ecd3a0ff) 45deg
    col.inactive_border = rgba(86aaeccc) rgba(93cee9cc) 45deg
}

decoration {
    rounding = 10
    active_opacity = 0.90
    inactive_opacity = 0.75
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        ignore_opacity = true
        new_optimizations = true
        passes = 4
        size = 5
        xray = false
    }

    shadow {
        enabled = false
    }
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    vrr = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    anr_missed_pings = 5
    allow_session_lock_restore = true
}

xwayland {
    force_zero_scaling = true
}

general {
    snap {
        border_overlap = true
        enabled = true
        monitor_gap = 1
        respect_gaps = true
        window_gap = 1
    }
}

animations {
    enabled = true
}

# The current macOS animation profile will be migrated separately.
